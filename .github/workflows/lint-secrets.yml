name: lint-secrets
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 秘密・個人情報漏洩チェック
        run: |
          chmod +x scripts/lint-secrets.sh
          # このリポジトリの固有名・絶対パスも監視対象にしたい場合は下のマーカーで追加
          LINT_PERSONAL_MARKERS="${LINT_PERSONAL_MARKERS:-}" bash scripts/lint-secrets.sh